<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1>Trabalhando com dados v1.0</h1>
    <button onclick="clicou()" style="font-size: large; width: 300px; height: 100px;cursor: pointer;">Clique para começar</button>
    <script>
        function clicou(){
            var nome = window.prompt('Digite seu nome:')
            window.alert (`Olá ${nome}, seja bem-vindo!`)
        }
    </script>
</body>
</html>
