<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <h1>Trabalhando com dado v2.0</h1>
    <button onclick="clicou()" style="font-size: large; width: 300px; height: 100px;cursor: pointer;">Clique aqui para começar</button>
    <section id="resultado"><p>Aqui vai aparecer o resultado...</p></section>
    <script>
        function clicou(){
            var nome = window.prompt('Qual o seu nome:')
            var res = window.document.getElementById('resultado')
            res.innerHTML = `<p>Olá, <strong>${nome}!</strong> Prazer em te conhecer.</p>`
        }
    </script>
</body>
</html>
